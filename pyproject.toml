[project]
name = "swaddle"
version = "1.0.0"
description = "Hands-free baby care for Alexa+: an MCP server (Streamable HTTP, spec 2025-11-25+) for logging feeds, diapers, sleep and temperatures by voice."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shermaine Yap Shi Min" }]
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "numpy>=1.26",
  "uvicorn>=0.30",
  "starlette>=0.37",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "anyio>=4"]

[project.scripts]
swaddle = "swaddle.server:main"
swaddle-seed = "swaddle.seed:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["swaddle"]

[tool.setuptools.package-data]
swaddle = ["ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
